name: fixture
on:
  workflow_dispatch:
    inputs:
      write_shop_progress_secret:
        description: "Overwrite the live delivery key with this repository's value"
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
  pull-requests: read
concurrency:
  group: fixture
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: The release guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/release-guard.sh
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm exec wrangler deploy
      - name: Write the delivery key, only when asked
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PROGRESS_SECRET: ${{ secrets.SHOP_PROGRESS_SECRET }}
        run: printf '%s' "$PROGRESS_SECRET" | pnpm exec wrangler secret put SHOP_PROGRESS_SECRET
