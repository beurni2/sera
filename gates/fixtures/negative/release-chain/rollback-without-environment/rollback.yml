name: rollback
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version id (empty = the previous one)"
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: rollback
  cancel-in-progress: false
jobs:
  rollback:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Roll back
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          pnpm exec wrangler rollback ${VERSION:+"$VERSION"} --message "rollback"
