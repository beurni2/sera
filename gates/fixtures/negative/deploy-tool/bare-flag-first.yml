# Negative fixture: a PATH wrangler with a flag before the subcommand.
name: deploy
permissions:
  contents: read
on: workflow_dispatch
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy
        working-directory: services/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          wrangler --config services/worker/wrangler.toml deploy
