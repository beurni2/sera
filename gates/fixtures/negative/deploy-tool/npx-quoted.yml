# Negative fixture: npx hidden inside a quoted shell command.
name: deploy
permissions:
  contents: read
on: workflow_dispatch
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy
        working-directory: services/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          bash -c "npx --yes wrangler@4 deploy"
