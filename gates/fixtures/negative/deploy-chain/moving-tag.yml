name: fixture
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The release guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/release-guard.sh
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm exec wrangler deploy
