# SE-LIVE-3 (M4) — the custody Worker: one door (Bearer SERA_CUSTODY_OPS_SECRET),
# one CustodyDO PER ORDER (idFromName(orderId)). The secret is set via
# `wrangler secret put` in the deploy workflow (piped) — NEVER a [vars] entry:
# this repo is PUBLIC, a var here would be published.
#
# ⚠ nodejs_compat IS LOAD-BEARING, and it was MEASURED, not assumed. The
# hash-chained ledger and the single-use secret registry hash with node's
# SYNCHRONOUS `createHash`. Probed on real workerd before this file existed:
# WITH the flag they run unchanged (append + verifyChain + consume all pass);
# WITHOUT it the module does not even resolve. That is why the custody core
# needed no rewrite for the Worker — and why removing this flag breaks custody
# entirely rather than subtly.
#
# UNPROVEN UNTIL A REAL `wrangler deploy` RUNS. Miniflare binds the DO by its
# own test config, never this file — the binding, the flag and the
# [[migrations]] block are validated only by an actual deploy.

name = "custody-service"
main = "dist-worker/worker.mjs"
compatibility_date = "2025-07-05"
compatibility_flags = ["nodejs_compat"]

# SE-LIVE-5a — the eligibility wire's TARGET. The base is CONFIG (a public
# workers.dev URL, same class as every EXPO_PUBLIC_* base); the credential
# beside it (SHOP_PROGRESS_SECRET = Shop+'s PROGRESS_WRITE_SECRET) is set via
# `wrangler secret put`, piped, the founder's alone — never here.
[vars]
SHOP_PROGRESS_BASE = "https://storefront-service.ilboudobernard2.workers.dev"

[[durable_objects.bindings]]
name = "CUSTODY"
class_name = "CustodyDO"

# SE-LIVE-4a — one claim object PER PACKAGE. Canon keys the custody record by
# package (Build Spec:79, SE-I04) while CustodyDO is keyed by order, so the
# custody object wins this claim before it writes its chain. Reached only from
# inside CustodyDO — the Worker's own routes never address it.
[[durable_objects.bindings]]
name = "PACKAGE_CLAIM"
class_name = "PackageClaimDO"

# FIRST-DEPLOY MIGRATION — `new_sqlite_classes` (the protection-service and
# logistics-service precedent): key-value-backed DO namespaces are no longer
# issued, and SQLite-backed DOs expose the same storage API this object uses.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["CustodyDO"]

# v2 — the SE-LIVE-4a claim class. A SEPARATE TAG, not an edit of v1: tag v1
# is already applied on the live Worker (custody-deploy run #1 succeeded on
# 2026-08-07, provenance asserted), and wrangler applies tags it has not seen.
# Editing an applied tag is how a migration silently does nothing.
[[migrations]]
tag = "v2"
new_sqlite_classes = ["PackageClaimDO"]

# SE-LIVE-4b-ii — custody asks logistics who a rider is; it never stores rider
# credentials (founder ruling 2026-08-07: one book mints and revokes, so a
# revoked code dies everywhere at once). The binding is TRANSPORT ONLY — the
# logistics `/verify/` door is still gated by SERA_RIDER_VERIFY_SECRET, because
# that Worker is publicly addressable.
[[services]]
binding = "LOGISTICS"
service = "logistics-service"
