name: custody-deploy

# SE-LIVE-3 (M4) — deploy the custody Worker (services/custody-service): one
# door (SERA_CUSTODY_OPS_SECRET), one CustodyDO per order. Mirrors
# logistics-deploy, including the F9 post-deploy provenance assertion.
#
# MANUAL ONLY (workflow_dispatch): a deploy is a deliberate act.
#
# ⚠ nodejs_compat: the custody core hashes with node's synchronous createHash.
# `wrangler.toml` carries the flag; it was MEASURED on workerd before the code
# was written (with it the ledger appends and the chain verifies; without it
# the module does not resolve). If a future change drops the flag, custody
# breaks entirely rather than subtly — which is the safe direction.
#
# SECRETS AND VARIABLES this run needs (repo settings):
#   · CLOUDFLARE_API_TOKEN (secret) — the Workers deploy token.
#   · SERA_RIDER_VERIFY_SECRET (secret) — the custody↔logistics rider-code
#     verification door. Shared by BOTH Workers; set it in both repos-of-record
#     or the wire is dead in one direction. Fail-closed if absent.
#   · PLATFORM_CONTRACTS_READ_TOKEN (secret) — same read token ci.yml uses.
#   · SERA_CUSTODY_OPS_SECRET (secret) — the founder's key to the custody
#     ledger. His alone; never bundled into any app.
#   · SERA_PRODUCE_SECRET (secret) — logistics' key to /produce/* (VRAI-ROUTE:
#     chain-open at dispatch + the machine pickup code). One repo secret,
#     armed on BOTH Workers (this workflow and logistics-deploy).
#   · SHOP_ARM_SECRET (secret) — Shop+'s key to /produce-shop/secrets/arm
#     (the buyer's drop code). The SAME VALUE must also be a repo secret in
#     beurni2/shop-plus for storefront-deploy to arm on its side.
#   · CUSTODY_BASE (variable — a public URL) — set after the first deploy so
#     the provenance step can prove the live Worker is this build.
#   · SERA_CUSTODY_OPS_SECRET_NEXT / SERA_PRODUCE_SECRET_NEXT / SHOP_ARM_SECRET_NEXT
#     (optional secrets — only during a key change): the new value of a key
#     this Worker checks, accepted beside the old one until the change is
#     finished. Delete it from the repo and re-dispatch to close the window.
#
# FAIL-CLOSED: deployed before the secret is set, every gated route answers the
# one identical 401. Correct, not broken.

on:
  workflow_dispatch:
    inputs:
      write_shop_progress_secret:
        description: "Also write the delivery key (SHOP_PROGRESS_SECRET) onto the live custody Worker. This OVERWRITES the value the Worker holds now with this repository's secret; leave it unticked to keep the live value."
        type: boolean
        default: false

# `actions: read` and `pull-requests: read` are for the first step alone: it asks
# GitHub whether ci is green on this commit and which pull requests are open.
permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: custody-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Nothing goes live until the founder approves this run (and sees its commit).
    environment: production
    steps:
      # Every action pinned to a commit SHA, the tag it resolves from kept
      # beside it (the same pins Shop+ and Boutik+ run): a moving tag is code
      # nobody here reviewed.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # Only a commit ci has passed — and whose newest finished ci run is
      # green — can go live. The reasons are in the script's header.
      - name: Only a commit green in ci can go live
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/release-guard.sh
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0 (what the moving v4 resolves to)
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      # The platform-contracts grant is SCOPED: a gitconfig under the runner's
      # temp dir that only this step reads (GIT_CONFIG_GLOBAL), the token as
      # env rather than in the script text, nothing written when the secret is
      # unset (platform-contracts is public; the lockfile resolves it to a
      # codeload tarball), and the file deleted when the install ends. Three URL
      # forms, one tokened rewrite (pnpm records git deps in ssh/scp form on
      # some resolve paths); --add, because url.<base>.insteadOf is single-valued.
      - name: Install (frozen lockfile) with a scoped platform-contracts grant, discarded after
        env:
          GIT_CONFIG_GLOBAL: ${{ runner.temp }}/platform-contracts.gitconfig
          PLATFORM_CONTRACTS_READ_TOKEN: ${{ secrets.PLATFORM_CONTRACTS_READ_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${PLATFORM_CONTRACTS_READ_TOKEN}" ]; then
            B="https://x-access-token:${PLATFORM_CONTRACTS_READ_TOKEN}@github.com/beurni2/platform-contracts"
            git config --global url."$B".insteadOf "https://github.com/beurni2/platform-contracts"
            git config --global --add url."$B".insteadOf "git@github.com:beurni2/platform-contracts"
            git config --global --add url."$B".insteadOf "ssh://git@github.com/beurni2/platform-contracts"
          fi
          trap 'rm -f "$GIT_CONFIG_GLOBAL"' EXIT
          pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Resolve the provenance stamp
        run: |
          echo "SERA_RELEASE=${{ github.sha }}" >> "$GITHUB_ENV"
          echo "SERA_CANON=$(node -p "require('./node_modules/@platform/contracts/package.json').version")" >> "$GITHUB_ENV"
      # Bundled explicitly, AFTER build — never trusted to a cached task output.
      - name: Bundle the custody Worker
        run: pnpm --filter @sera/custody-service bundle:worker
      # The deploy tool comes from the lock file (wrangler 4.130.0, a
      # devDependency of this service, integrity-checked) through `pnpm exec`,
      # never fetched from the registry at deploy time beside the Cloudflare key.
      - name: Deploy to Cloudflare Workers
        working-directory: services/custody-service
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm exec wrangler deploy
      - name: Arm SERA_CUSTODY_OPS_SECRET (piped — skipped only if the repo secret is absent)
        working-directory: services/custody-service
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CUSTODY_SECRET: ${{ secrets.SERA_CUSTODY_OPS_SECRET }}
        run: |
          if [ -z "$CUSTODY_SECRET" ]; then
            echo "::warning title=Porte custody NON armée::SERA_CUSTODY_OPS_SECRET absent — the custody door refuses everything (fail-closed) until the repo secret is set and this workflow re-dispatched."
            exit 0
          fi
          printf '%s' "$CUSTODY_SECRET" | pnpm exec wrangler secret put SERA_CUSTODY_OPS_SECRET

      - name: Arm SERA_RIDER_VERIFY_SECRET (piped — skipped only if the repo secret is absent)
        working-directory: services/custody-service
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RIDER_VERIFY_SECRET: ${{ secrets.SERA_RIDER_VERIFY_SECRET }}
        run: |
          if [ -z "$RIDER_VERIFY_SECRET" ]; then
            echo "::warning title=Porte rider-verify NON armée::SERA_RIDER_VERIFY_SECRET absent — custody cannot ask logistics who a rider is, so the rider door refuses rider-code verification (fail-closed) until the repo secret is set and this workflow re-dispatched."
            exit 0
          fi
          printf '%s' "$RIDER_VERIFY_SECRET" | pnpm exec wrangler secret put SERA_RIDER_VERIFY_SECRET

      # VRAI-ROUTE (2026-08-10) — the two PRODUCER keys. SERA_PRODUCE_SECRET is
      # logistics' key to /produce/* (chain-open at dispatch + the machine
      # pickup code): ONE repo secret serves both Workers, logistics-deploy
      # arms the same value on its side. SHOP_ARM_SECRET is Shop+'s key to
      # /produce-shop/secrets/arm (the buyer's drop code): the SAME VALUE must
      # be set as a repo secret in beurni2/shop-plus, or the arm wire refuses
      # 401 forever. Fail-closed if absent, as every door here.
      - name: Arm SERA_PRODUCE_SECRET (piped — skipped only if the repo secret is absent)
        working-directory: services/custody-service
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PRODUCE_SECRET: ${{ secrets.SERA_PRODUCE_SECRET }}
        run: |
          if [ -z "$PRODUCE_SECRET" ]; then
            echo "::warning title=Porte produce NON armée::SERA_PRODUCE_SECRET absent — dispatch cannot open the custody chain or arm the machine pickup code (fail-closed) until the repo secret is set and this workflow re-dispatched."
            exit 0
          fi
          printf '%s' "$PRODUCE_SECRET" | pnpm exec wrangler secret put SERA_PRODUCE_SECRET

      - name: Arm SHOP_ARM_SECRET (piped — skipped only if the repo secret is absent)
        working-directory: services/custody-service
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ARM_SECRET: ${{ secrets.SHOP_ARM_SECRET }}
        run: |
          if [ -z "$ARM_SECRET" ]; then
            echo "::warning title=Porte produce-shop NON armée::SHOP_ARM_SECRET absent — Shop+ cannot arm the buyer's drop code (fail-closed) until the repo secret is set and this workflow re-dispatched."
            exit 0
          fi
          printf '%s' "$ARM_SECRET" | pnpm exec wrangler secret put SHOP_ARM_SECRET

      # COURSE-LIVRÉE (2026-08-13) — custody PRESENTS this key at logistics'
      # /produce/course-livree door: the drop confirmation that closes the
      # course as `delivered` and frees the rider for the next one. ONE repo
      # secret serves both Workers — logistics-deploy arms the same value on
      # its side (where the door gates on it). Unarmed here, every finished
      # course rests `unsendable_no_config` and the rider stays « carrying »
      # on his console — the RETOUR-CONSOLES silence, on a third wire.
      - name: Arm SERA_COURSE_LIVREE_SECRET (piped — skipped only if the repo secret is absent)
        working-directory: services/custody-service
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          LIVREE_SECRET: ${{ secrets.SERA_COURSE_LIVREE_SECRET }}
        run: |
          if [ -z "$LIVREE_SECRET" ]; then
            echo "::warning title=Fil course-livrée NON armé::SERA_COURSE_LIVREE_SECRET absent — une remise confirmée ne libère JAMAIS le coursier (la course reste sur son écran et il reste « en course » au tableau). Rien n'est perdu, mais relancer ce workflow ne suffit pas : posez le secret, redéployez, puis SAISISSEZ LE CODE DE REMISE UNE NOUVELLE FOIS sur la commande touchée — cette validation relance la file. Même valeur sur les deux Workers."
            exit 0
          fi
          printf '%s' "$LIVREE_SECRET" | pnpm exec wrangler secret put SERA_COURSE_LIVREE_SECRET

      # ⚠ THE WIRE THAT CARRIES A FINISHED DELIVERY BACK TO THE CONSOLES, AND
      # WHICH WAS NEVER ARMED (founder report 2026-08-10: « once I tap in the
      # buyer's code nothing happens »).
      #
      # The rider's screen was right — custody recorded `custody_with_customer`
      # — but `flushEligibility` and `flushTransit` both open with
      # `if (shop === undefined || secret === '')` and park the row as
      # `unsendable_no_config`. This workflow armed four secrets and never this
      # one, so EVERY delivery, EVERY « en route » and EVERY « arrivée » has
      # been resting in the outbox instead of reaching Shop+ — and therefore
      # never reaching Boutik+'s supplier console, which learns of a delivery
      # only through Shop+'s `/fulfillment/delivered`.
      #
      # Nothing was lost: the rows rest with their attempts intact and are
      # revived by the alarm once this is set, which is what « honest resting
      # state, never a silent drop » was built for.
      #
      # ⚠ SAME VALUE AS SHOP+'s `SERA_PROGRESS_SECRET` — Séra's own key on
      # the `/fulfillment/progress` and `/fulfillment/transit` doors of the
      # storefront Worker since 2026-09-03 (SECTEURS-PROGRES-1). NEVER Shop+'s
      # `PROGRESS_WRITE_SECRET`: that one now opens only Boutik+'s preparation
      # facts, so it is answered 403 `wrong_writer` here, and any other value
      # is a 401 — every attempt, the same class of silence as the media key.
      # This step used to write the repository secret onto the Worker on EVERY
      # run, so a value set on the Worker by hand was silently replaced. It now
      # writes only when the person dispatching ticks
      # « write_shop_progress_secret »; otherwise the live value is left alone,
      # and the next step says so in the log.
      - name: Arm SHOP_PROGRESS_SECRET (piped — only when asked, skipped if the repo secret is absent)
        if: inputs.write_shop_progress_secret
        working-directory: services/custody-service
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PROGRESS_SECRET: ${{ secrets.SHOP_PROGRESS_SECRET }}
        run: |
          if [ -z "$PROGRESS_SECRET" ]; then
            echo "::warning title=Retour vers les consoles NON armé::SHOP_PROGRESS_SECRET absent — une livraison terminée, un départ et une arrivée restent dans la file (unsendable_no_config) et n'arrivent JAMAIS sur la console du fournisseur ni sur la vôtre. Rien n'est perdu : la file repart dès que le secret est posé et ce workflow relancé. Il doit valoir exactement le SERA_PROGRESS_SECRET de shop-plus, jamais son PROGRESS_WRITE_SECRET."
            exit 0
          fi
          printf '%s' "$PROGRESS_SECRET" | pnpm exec wrangler secret put SHOP_PROGRESS_SECRET
      - name: The delivery key was left as it is
        if: ${{ !inputs.write_shop_progress_secret }}
        run: echo "::notice title=Clé de livraison inchangée::SHOP_PROGRESS_SECRET n'a pas été réécrite sur le Worker de garde — la valeur en place reste. Pour la réécrire avec celle du dépôt, relancer ce workflow en cochant write_shop_progress_secret."

      # KEY CHANGE WINDOW (batch 8) — every key this Worker CHECKS also opens
      # to its `_NEXT` value while one is set, so a sender can move to a new
      # value before the old one stops working. A repo secret X_NEXT is put on
      # the Worker here; once it is gone from the repo, this run deletes it
      # from the Worker too, so a finished change never leaves an old value
      # open. Runs AFTER every key above, so a promotion (X = the new value,
      # X_NEXT deleted) never has a moment where only the old value opens.
      # Names only are printed — never a value or a length.
      - name: Arm or clear the next keys (X_NEXT — the window of a key change)
        working-directory: services/custody-service
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SERA_CUSTODY_OPS_SECRET_NEXT: ${{ secrets.SERA_CUSTODY_OPS_SECRET_NEXT }}
          SERA_PRODUCE_SECRET_NEXT: ${{ secrets.SERA_PRODUCE_SECRET_NEXT }}
          SHOP_ARM_SECRET_NEXT: ${{ secrets.SHOP_ARM_SECRET_NEXT }}
        run: |
          set -euo pipefail
          LISTED=$(pnpm exec wrangler secret list)
          for NAME in SERA_CUSTODY_OPS_SECRET_NEXT SERA_PRODUCE_SECRET_NEXT SHOP_ARM_SECRET_NEXT; do
            VALUE="${!NAME:-}"
            if [ -n "$VALUE" ]; then
              printf '%s' "$VALUE" | pnpm exec wrangler secret put "$NAME"
              echo "::warning title=Changement de clé en cours::$NAME is set — the old and the new value of ${NAME%_NEXT} both open its doors. To finish: once every sender presents the new value, put it in ${NAME%_NEXT}, delete $NAME from this repository's secrets, and run this workflow again."
            elif grep -q "\"name\": *\"$NAME\"" <<<"$LISTED"; then
              printf 'y\n' | pnpm exec wrangler secret delete "$NAME"
              echo "$NAME: deleted from the Worker — only ${NAME%_NEXT} opens its doors now"
            fi
          done

      # ═══ The F9 assertion: the live Worker must BE the bundle this job built ═══
      - name: Assert the live custody Worker is the bundle this job built
        env:
          CUSTODY_BASE: ${{ vars.CUSTODY_BASE }}
        run: |
          set -uo pipefail
          if [ -z "${CUSTODY_BASE}" ]; then
            echo "::error::CUSTODY_BASE repo variable is empty — the deploy above ran, but NOTHING verified it."
            echo "Set the variable to the Worker's URL and re-dispatch so this step can prove the live Worker is this build."
            exit 1
          fi
          BASE="${CUSTODY_BASE%/}"
          OUT=$(mktemp)
          DEADLINE=$(( $(date +%s) + 180 ))
          LIVE_CANON='?'; LIVE_RELEASE='?'
          while :; do
            CODE=$(curl -sS -o "$OUT" -w '%{http_code}' "$BASE/health" || echo 000)
            if [ "$CODE" = "200" ]; then
              LIVE_CANON=$(node -p "JSON.parse(require('fs').readFileSync('$OUT','utf8')).canon" 2>/dev/null || echo '?')
              LIVE_RELEASE=$(node -p "JSON.parse(require('fs').readFileSync('$OUT','utf8')).release" 2>/dev/null || echo '?')
              echo "health 200 — live canon=$LIVE_CANON release=$LIVE_RELEASE (want $SERA_CANON / $SERA_RELEASE)"
              if [ "$LIVE_CANON" = "$SERA_CANON" ] && [ "$LIVE_RELEASE" = "$SERA_RELEASE" ]; then
                echo "PROVENANCE OK — live custody Worker is $SERA_RELEASE speaking canon $SERA_CANON."
                exit 0
              fi
            else
              echo "health $CODE — not answering yet"
            fi
            if [ "$(date +%s)" -ge "$DEADLINE" ]; then
              echo "::error::DEPLOY DID NOT TAKE — after 180s the live custody Worker is still not this job's bundle."
              exit 1
            fi
            sleep 10
          done
