name: custody-deploy

# SE-LIVE-3 (M4) — deploy the custody Worker (services/custody-service): one
# door (SERA_CUSTODY_OPS_SECRET), one CustodyDO per order. Mirrors
# logistics-deploy, including the F9 post-deploy provenance assertion.
#
# MANUAL ONLY (workflow_dispatch): a deploy is a deliberate act.
#
# ⚠ nodejs_compat: the custody core hashes with node's synchronous createHash.
# `wrangler.toml` carries the flag; it was MEASURED on workerd before the code
# was written (with it the ledger appends and the chain verifies; without it
# the module does not resolve). If a future change drops the flag, custody
# breaks entirely rather than subtly — which is the safe direction.
#
# SECRETS AND VARIABLES this run needs (repo settings):
#   · CLOUDFLARE_API_TOKEN (secret) — the Workers deploy token.
#   · SERA_RIDER_VERIFY_SECRET (secret) — the custody↔logistics rider-code
#     verification door. Shared by BOTH Workers; set it in both repos-of-record
#     or the wire is dead in one direction. Fail-closed if absent.
#   · PLATFORM_CONTRACTS_READ_TOKEN (secret) — same read token ci.yml uses.
#   · SERA_CUSTODY_OPS_SECRET (secret) — the founder's key to the custody
#     ledger. His alone; never bundled into any app.
#   · SERA_PRODUCE_SECRET (secret) — logistics' key to /produce/* (VRAI-ROUTE:
#     chain-open at dispatch + the machine pickup code). One repo secret,
#     armed on BOTH Workers (this workflow and logistics-deploy).
#   · SHOP_ARM_SECRET (secret) — Shop+'s key to /produce-shop/secrets/arm
#     (the buyer's drop code). The SAME VALUE must also be a repo secret in
#     beurni2/shop-plus for storefront-deploy to arm on its side.
#   · CUSTODY_BASE (variable — a public URL) — set after the first deploy so
#     the provenance step can prove the live Worker is this build.
#
# FAIL-CLOSED: deployed before the secret is set, every gated route answers the
# one identical 401. Correct, not broken.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: custody-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Authorize read access to platform-contracts (CI-only)
        run: git config --global url."https://x-access-token:${{ secrets.PLATFORM_CONTRACTS_READ_TOKEN }}@github.com/beurni2/platform-contracts".insteadOf "https://github.com/beurni2/platform-contracts"
      - name: Authorize read access to platform-contracts (CI-only, SSH forms)
        run: |
          git config --global --add url."https://x-access-token:${{ secrets.PLATFORM_CONTRACTS_READ_TOKEN }}@github.com/beurni2/platform-contracts".insteadOf "git@github.com:beurni2/platform-contracts"
          git config --global --add url."https://x-access-token:${{ secrets.PLATFORM_CONTRACTS_READ_TOKEN }}@github.com/beurni2/platform-contracts".insteadOf "ssh://git@github.com/beurni2/platform-contracts"
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Resolve the provenance stamp
        run: |
          echo "SERA_RELEASE=${{ github.sha }}" >> "$GITHUB_ENV"
          echo "SERA_CANON=$(node -p "require('./node_modules/@platform/contracts/package.json').version")" >> "$GITHUB_ENV"
      # Bundled explicitly, AFTER build — never trusted to a cached task output.
      - name: Bundle the custody Worker
        run: pnpm --filter @sera/custody-service bundle:worker
      - name: Deploy to Cloudflare Workers
        working-directory: services/custody-service
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@4 deploy
      - name: Arm SERA_CUSTODY_OPS_SECRET (piped — skipped only if the repo secret is absent)
        working-directory: services/custody-service
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CUSTODY_SECRET: ${{ secrets.SERA_CUSTODY_OPS_SECRET }}
        run: |
          if [ -z "$CUSTODY_SECRET" ]; then
            echo "::warning title=Porte custody NON armée::SERA_CUSTODY_OPS_SECRET absent — the custody door refuses everything (fail-closed) until the repo secret is set and this workflow re-dispatched."
            exit 0
          fi
          printf '%s' "$CUSTODY_SECRET" | npx --yes wrangler@4 secret put SERA_CUSTODY_OPS_SECRET

      - name: Arm SERA_RIDER_VERIFY_SECRET (piped — skipped only if the repo secret is absent)
        working-directory: services/custody-service
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RIDER_VERIFY_SECRET: ${{ secrets.SERA_RIDER_VERIFY_SECRET }}
        run: |
          if [ -z "$RIDER_VERIFY_SECRET" ]; then
            echo "::warning title=Porte rider-verify NON armée::SERA_RIDER_VERIFY_SECRET absent — custody cannot ask logistics who a rider is, so the rider door refuses rider-code verification (fail-closed) until the repo secret is set and this workflow re-dispatched."
            exit 0
          fi
          printf '%s' "$RIDER_VERIFY_SECRET" | npx --yes wrangler@4 secret put SERA_RIDER_VERIFY_SECRET

      # VRAI-ROUTE (2026-08-10) — the two PRODUCER keys. SERA_PRODUCE_SECRET is
      # logistics' key to /produce/* (chain-open at dispatch + the machine
      # pickup code): ONE repo secret serves both Workers, logistics-deploy
      # arms the same value on its side. SHOP_ARM_SECRET is Shop+'s key to
      # /produce-shop/secrets/arm (the buyer's drop code): the SAME VALUE must
      # be set as a repo secret in beurni2/shop-plus, or the arm wire refuses
      # 401 forever. Fail-closed if absent, as every door here.
      - name: Arm SERA_PRODUCE_SECRET (piped — skipped only if the repo secret is absent)
        working-directory: services/custody-service
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PRODUCE_SECRET: ${{ secrets.SERA_PRODUCE_SECRET }}
        run: |
          if [ -z "$PRODUCE_SECRET" ]; then
            echo "::warning title=Porte produce NON armée::SERA_PRODUCE_SECRET absent — dispatch cannot open the custody chain or arm the machine pickup code (fail-closed) until the repo secret is set and this workflow re-dispatched."
            exit 0
          fi
          printf '%s' "$PRODUCE_SECRET" | npx --yes wrangler@4 secret put SERA_PRODUCE_SECRET

      - name: Arm SHOP_ARM_SECRET (piped — skipped only if the repo secret is absent)
        working-directory: services/custody-service
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ARM_SECRET: ${{ secrets.SHOP_ARM_SECRET }}
        run: |
          if [ -z "$ARM_SECRET" ]; then
            echo "::warning title=Porte produce-shop NON armée::SHOP_ARM_SECRET absent — Shop+ cannot arm the buyer's drop code (fail-closed) until the repo secret is set and this workflow re-dispatched."
            exit 0
          fi
          printf '%s' "$ARM_SECRET" | npx --yes wrangler@4 secret put SHOP_ARM_SECRET

      # COURSE-LIVRÉE (2026-08-13) — custody PRESENTS this key at logistics'
      # /produce/course-livree door: the drop confirmation that closes the
      # course as `delivered` and frees the rider for the next one. ONE repo
      # secret serves both Workers — logistics-deploy arms the same value on
      # its side (where the door gates on it). Unarmed here, every finished
      # course rests `unsendable_no_config` and the rider stays « carrying »
      # on his console — the RETOUR-CONSOLES silence, on a third wire.
      - name: Arm SERA_COURSE_LIVREE_SECRET (piped — skipped only if the repo secret is absent)
        working-directory: services/custody-service
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          LIVREE_SECRET: ${{ secrets.SERA_COURSE_LIVREE_SECRET }}
        run: |
          if [ -z "$LIVREE_SECRET" ]; then
            echo "::warning title=Fil course-livrée NON armé::SERA_COURSE_LIVREE_SECRET absent — une remise confirmée ne libère JAMAIS le coursier (la course reste sur son écran et il reste « en course » au tableau). Rien n'est perdu : la file repart dès que le secret est posé et ce workflow relancé. Même valeur sur les deux Workers."
            exit 0
          fi
          printf '%s' "$LIVREE_SECRET" | npx --yes wrangler@4 secret put SERA_COURSE_LIVREE_SECRET

      # ⚠ THE WIRE THAT CARRIES A FINISHED DELIVERY BACK TO THE CONSOLES, AND
      # WHICH WAS NEVER ARMED (founder report 2026-08-10: « once I tap in the
      # buyer's code nothing happens »).
      #
      # The rider's screen was right — custody recorded `custody_with_customer`
      # — but `flushEligibility` and `flushTransit` both open with
      # `if (shop === undefined || secret === '')` and park the row as
      # `unsendable_no_config`. This workflow armed four secrets and never this
      # one, so EVERY delivery, EVERY « en route » and EVERY « arrivée » has
      # been resting in the outbox instead of reaching Shop+ — and therefore
      # never reaching Boutik+'s supplier console, which learns of a delivery
      # only through Shop+'s `/fulfillment/delivered`.
      #
      # Nothing was lost: the rows rest with their attempts intact and are
      # revived by the alarm once this is set, which is what « honest resting
      # state, never a silent drop » was built for.
      #
      # ⚠ SAME VALUE AS SHOP+'s `PROGRESS_WRITE_SECRET`, which gates the
      # `/fulfillment/progress` and `/fulfillment/transit` doors on the
      # storefront Worker. A different value is a 401 on every attempt — the
      # same class of silence as the media write key.
      - name: Arm SHOP_PROGRESS_SECRET (piped — skipped only if the repo secret is absent)
        working-directory: services/custody-service
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PROGRESS_SECRET: ${{ secrets.SHOP_PROGRESS_SECRET }}
        run: |
          if [ -z "$PROGRESS_SECRET" ]; then
            echo "::warning title=Retour vers les consoles NON armé::SHOP_PROGRESS_SECRET absent — une livraison terminée, un départ et une arrivée restent dans la file (unsendable_no_config) et n'arrivent JAMAIS sur la console du fournisseur ni sur la vôtre. Rien n'est perdu : la file repart dès que le secret est posé et ce workflow relancé. Il doit valoir exactement le PROGRESS_WRITE_SECRET de shop-plus."
            exit 0
          fi
          printf '%s' "$PROGRESS_SECRET" | npx --yes wrangler@4 secret put SHOP_PROGRESS_SECRET

      # ═══ The F9 assertion: the live Worker must BE the bundle this job built ═══
      - name: Assert the live custody Worker is the bundle this job built
        env:
          CUSTODY_BASE: ${{ vars.CUSTODY_BASE }}
        run: |
          set -uo pipefail
          if [ -z "${CUSTODY_BASE}" ]; then
            echo "::error::CUSTODY_BASE repo variable is empty — the deploy above ran, but NOTHING verified it."
            echo "Set the variable to the Worker's URL and re-dispatch so this step can prove the live Worker is this build."
            exit 1
          fi
          BASE="${CUSTODY_BASE%/}"
          OUT=$(mktemp)
          DEADLINE=$(( $(date +%s) + 180 ))
          LIVE_CANON='?'; LIVE_RELEASE='?'
          while :; do
            CODE=$(curl -sS -o "$OUT" -w '%{http_code}' "$BASE/health" || echo 000)
            if [ "$CODE" = "200" ]; then
              LIVE_CANON=$(node -p "JSON.parse(require('fs').readFileSync('$OUT','utf8')).canon" 2>/dev/null || echo '?')
              LIVE_RELEASE=$(node -p "JSON.parse(require('fs').readFileSync('$OUT','utf8')).release" 2>/dev/null || echo '?')
              echo "health 200 — live canon=$LIVE_CANON release=$LIVE_RELEASE (want $SERA_CANON / $SERA_RELEASE)"
              if [ "$LIVE_CANON" = "$SERA_CANON" ] && [ "$LIVE_RELEASE" = "$SERA_RELEASE" ]; then
                echo "PROVENANCE OK — live custody Worker is $SERA_RELEASE speaking canon $SERA_CANON."
                exit 0
              fi
            else
              echo "health $CODE — not answering yet"
            fi
            if [ "$(date +%s)" -ge "$DEADLINE" ]; then
              echo "::error::DEPLOY DID NOT TAKE — after 180s the live custody Worker is still not this job's bundle."
              exit 1
            fi
            sleep 10
          done
