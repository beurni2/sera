name: logistics-deploy

# SE-LIVE-1 — deploy the logistics Worker (services/logistics-service): three
# doors (SERA_OPS_SECRET / SERA_INTAKE_SECRET / rider personal codes) in
# front of the one LogisticsDO. Mirrors platform's protection-deploy,
# including the post-deploy provenance assertion (the AUDIT-B+1 F9 lesson:
# `wrangler deploy` proves the upload was accepted, not that the running
# Worker is this bundle).
#
# MANUAL ONLY (workflow_dispatch): a deploy is a deliberate act — the
# standing ruling that governs every deploy workflow in the ecosystem.
#
# UNPROVEN UNTIL THIS ACTUALLY RUNS: logistics-service has NEVER been
# deployed. The DO binding and the [[migrations]] block in wrangler.toml are
# validated only by a real deploy (miniflare binds by its own test config).
#
# SECRETS AND VARIABLES this run needs (repo settings):
#   · CLOUDFLARE_API_TOKEN (secret) — Workers deploy token.
#   · PLATFORM_CONTRACTS_READ_TOKEN (secret) — same read token ci.yml uses.
#   · SERA_OPS_SECRET (secret) — the founder's ONE key to the dispatch board,
#     rider roster, code mint/revoke and the raw authority route. Set on the
#     Worker with `wrangler secret put` (value PIPED, never an argument,
#     never [vars] — this repo is public). THE FOUNDER'S ALONE: never bundled
#     into any app.
#   · SERA_INTAKE_SECRET (secret) — the producers' door (task_ready +
#     funding/readiness facts; SE-LIVE-2 hands it to the Shop+/Boutik+
#     emitters). Distinct from the ops key on purpose — either opens ONLY its
#     own door.
#   · SERA_INTAKE_SHOP_SECRET / SERA_INTAKE_BOUTIK_SECRET (secrets) —
#     CLES-PRODUCTEURS-1 (AUDIT-B+2 F-40): each producer's OWN intake key.
#     Shop+'s opens /intake/funding only; Boutik+'s readiness and both
#     handover verdicts; /intake/task-ready opens to neither.
#     The changeover: set both here (and re-dispatch), put each value into
#     its producer's SERA_INTAKE_SECRET and redeploy that producer, then
#     delete SERA_INTAKE_SECRET from this repo and re-dispatch: with both
#     producer keys set and the shared one gone from the repo, this workflow
#     deletes it from the Worker too — until then the shared key still opens
#     every intake door, so nothing is refused mid-swap. /health answers
#     `intakeSplit: true` once the swap is finished.
#   · SERA_OPS_SECRET_NEXT / SERA_RIDER_VERIFY_SECRET_NEXT /
#     SERA_COURSE_LIVREE_SECRET_NEXT / SERA_INTAKE_SHOP_SECRET_NEXT /
#     SERA_INTAKE_BOUTIK_SECRET_NEXT (optional secrets — only during a key
#     change): the new value of a key this Worker checks, accepted beside the
#     old one until the change is finished. Delete it from the repo and
#     re-dispatch to close the window. The shared SERA_INTAKE_SECRET has none.
#   · LOGISTICS_BASE (variable, not secret — a public URL) — the deployed
#     Worker's base URL (e.g. https://logistics-service.<account>.workers.dev),
#     used by the provenance assertion below. On the FIRST dispatch this may
#     not exist yet: the deploy still runs, the assertion fails red with
#     instructions — set the variable and re-dispatch.
#   · SERA_CONSOLE_ORIGIN (variable — origins are public) — exact-origin CORS
#     allowlist for the browser surfaces (SE-LIVE-4), comma-separated. Empty ⇒
#     no CORS at all, which means NO BROWSER can call this Worker: the Boutik+
#     console's « Coursiers » zone (rider roster + code mint) goes dark. Set it
#     to the console's EXACT origin — https://boutik-plus-web.pages.dev — not
#     to a per-deployment Pages URL (https://<hash>.boutik-plus-web.pages.dev
#     changes on every deploy and can never be allowlisted ahead of time).
#
# FAIL-CLOSED BY CONSTRUCTION: a Worker deployed before its secrets are set
# refuses every gated request with the one identical 401. That is correct,
# not broken — set the secrets (or re-dispatch with them configured) to arm
# the doors. And with no funding/readiness facts posted, NOTHING is admitted
# to the ready-queue: the projections refuse closed until SE-LIVE-2 wires the
# real producers.

on:
  workflow_dispatch:

# `actions: read` and `pull-requests: read` are for the first step alone: it asks
# GitHub whether ci is green on this commit and which pull requests are open.
permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: logistics-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Nothing goes live until the founder approves this run (and sees its commit).
    environment: production
    steps:
      # Every action pinned to a commit SHA, the tag it resolves from kept
      # beside it (the same pins Shop+ and Boutik+ run): a moving tag is code
      # nobody here reviewed.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # Only a commit ci has passed — and whose newest finished ci run is
      # green — can go live. The reasons are in the script's header.
      - name: Only a commit green in ci can go live
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/release-guard.sh
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0 (what the moving v4 resolves to)
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      # The platform-contracts grant is SCOPED: a gitconfig under the runner's
      # temp dir that only this step reads (GIT_CONFIG_GLOBAL), the token as
      # env rather than in the script text, nothing written when the secret is
      # unset (platform-contracts is public; the lockfile resolves it to a
      # codeload tarball), and the file deleted when the install ends. Three URL
      # forms, one tokened rewrite (pnpm records git deps in ssh/scp form on
      # some resolve paths); --add, because url.<base>.insteadOf is single-valued.
      - name: Install (frozen lockfile) with a scoped platform-contracts grant, discarded after
        env:
          GIT_CONFIG_GLOBAL: ${{ runner.temp }}/platform-contracts.gitconfig
          PLATFORM_CONTRACTS_READ_TOKEN: ${{ secrets.PLATFORM_CONTRACTS_READ_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${PLATFORM_CONTRACTS_READ_TOKEN}" ]; then
            B="https://x-access-token:${PLATFORM_CONTRACTS_READ_TOKEN}@github.com/beurni2/platform-contracts"
            git config --global url."$B".insteadOf "https://github.com/beurni2/platform-contracts"
            git config --global --add url."$B".insteadOf "git@github.com:beurni2/platform-contracts"
            git config --global --add url."$B".insteadOf "ssh://git@github.com/beurni2/platform-contracts"
          fi
          trap 'rm -f "$GIT_CONFIG_GLOBAL"' EXIT
          pnpm install --frozen-lockfile
      # Compile workspace packages FIRST (the trap that killed shop-plus's
      # first deploy: bundling before dist/ exists).
      - run: pnpm build
      # Provenance stamp — release is this sha; canon is read from the
      # INSTALLED package, never hand-typed, so it cannot drift from what was
      # actually bundled.
      - name: Resolve the provenance stamp
        run: |
          echo "SERA_RELEASE=${{ github.sha }}" >> "$GITHUB_ENV"
          echo "SERA_CANON=$(node -p "require('./node_modules/@platform/contracts/package.json').version")" >> "$GITHUB_ENV"
      # Bundled HERE, explicitly, AFTER pnpm build — never trusted to a cached
      # task output (the platform turbo-cache lesson: a warm replay can hand
      # back a stale artifact under a green board).
      - name: Bundle the logistics Worker
        run: pnpm --filter @sera/logistics-service bundle:worker
      # The deploy tool comes from the lock file (wrangler 4.130.0, a
      # devDependency of this service, integrity-checked) through `pnpm exec`,
      # never fetched from the registry at deploy time beside the Cloudflare key.
      - name: Deploy to Cloudflare Workers
        working-directory: services/logistics-service
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CONSOLE_ORIGIN: ${{ vars.SERA_CONSOLE_ORIGIN }}
        run: |
          # THE SILENT ELSE COST A LIVE DEBUGGING ROUND (2026-08-08, journaled):
          # this step deployed with CONSOLE_ORIGIN empty, said nothing, and the
          # founder's « Coursiers » zone in the Boutik+ console then failed on
          # every read — the browser preflight gets a 204 with no
          # Access-Control-Allow-Origin, `fetch` rejects, and the zone can only
          # say « la liste n'est pas arrivée ». Correct behaviour, unreadable
          # cause. A Worker with no CORS is not broken, but it IS invisible to
          # every browser surface, and that fact must be stated at deploy time.
          #
          # Not a hard guard: the rider app is native and the intake producers
          # are server-to-server — neither needs CORS, so an empty allowlist is
          # a legitimate deploy. It is only the BROWSER surfaces that die.
          if [ -n "$CONSOLE_ORIGIN" ]; then
            echo "CORS armed for: $CONSOLE_ORIGIN"
            pnpm exec wrangler deploy --var SERA_CONSOLE_ORIGIN:"$CONSOLE_ORIGIN"
          else
            echo "::warning title=CORS NON armé::the repo VARIABLE SERA_CONSOLE_ORIGIN is empty — this Worker will refuse EVERY browser call. The Boutik+ console's « Coursiers » zone cannot list riders or mint a code until it is set to the console's exact origin (e.g. https://boutik-plus-web.pages.dev) and this workflow is re-dispatched. Native apps and server-to-server intake are unaffected."
            pnpm exec wrangler deploy
          fi
      # Secrets are set AFTER the first deploy (wrangler cannot put a secret
      # on a Worker that does not exist yet). Values PIPED, never arguments —
      # arguments land in process lists and logs.
      - name: Arm SERA_OPS_SECRET (piped — skipped only if the repo secret is absent)
        working-directory: services/logistics-service
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          OPS_SECRET: ${{ secrets.SERA_OPS_SECRET }}
        run: |
          if [ -z "$OPS_SECRET" ]; then
            echo "::warning title=Porte ops NON armée::SERA_OPS_SECRET absent — the ops door refuses everything (fail-closed) until the repo secret is set and this workflow re-dispatched."
            exit 0
          fi
          printf '%s' "$OPS_SECRET" | pnpm exec wrangler secret put SERA_OPS_SECRET
      # THE INTAKE KEY SWAP, IN ITS ORDER. Each producer's own key goes on
      # first; only then is the shared key handled, so no step of the swap
      # leaves a door with no key (step 1: both producer keys set here; step 2:
      # each producer presents its own; step 3: the shared repo secret deleted
      # and this run removes it from the Worker). Every outcome is a warning
      # until the swap is finished, and /health says `intakeSplit` when it is.
      - name: Arm SERA_INTAKE_SHOP_SECRET and SERA_INTAKE_BOUTIK_SECRET (piped — each skipped while its repo secret is absent)
        working-directory: services/logistics-service
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SHOP_KEY: ${{ secrets.SERA_INTAKE_SHOP_SECRET }}
          BOUTIK_KEY: ${{ secrets.SERA_INTAKE_BOUTIK_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "$SHOP_KEY" ]; then
            echo "::warning title=Clé intake Shop+ non posée::SERA_INTAKE_SHOP_SECRET is not in this repository's secrets, so this run does not write it; the Worker keeps whatever it already holds (step 1 of the key swap not done, or the key was removed here)."
          else
            printf '%s' "$SHOP_KEY" | pnpm exec wrangler secret put SERA_INTAKE_SHOP_SECRET
          fi
          if [ -z "$BOUTIK_KEY" ]; then
            echo "::warning title=Clé intake Boutik+ non posée::SERA_INTAKE_BOUTIK_SECRET is not in this repository's secrets, so this run does not write it; the Worker keeps whatever it already holds (step 1 of the key swap not done, or the key was removed here)."
          else
            printf '%s' "$BOUTIK_KEY" | pnpm exec wrangler secret put SERA_INTAKE_BOUTIK_SECRET
          fi
      - name: Arm or retire SERA_INTAKE_SECRET (piped — retired only once both producer keys are set)
        working-directory: services/logistics-service
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          INTAKE_SECRET: ${{ secrets.SERA_INTAKE_SECRET }}
          SHOP_KEY: ${{ secrets.SERA_INTAKE_SHOP_SECRET }}
          BOUTIK_KEY: ${{ secrets.SERA_INTAKE_BOUTIK_SECRET }}
        run: |
          set -euo pipefail
          if [ -n "$INTAKE_SECRET" ]; then
            printf '%s' "$INTAKE_SECRET" | pnpm exec wrangler secret put SERA_INTAKE_SECRET
            if [ -n "$SHOP_KEY" ] && [ -n "$BOUTIK_KEY" ]; then
              echo "::warning title=Échange de clés : étape 3 à faire::Both producer keys are set, but the shared SERA_INTAKE_SECRET still opens every intake door. Once Shop+ and Boutik+ each present their own key, delete SERA_INTAKE_SECRET from this repository's secrets and run this workflow again."
            else
              echo "::warning title=Clé intake partagée::The shared SERA_INTAKE_SECRET opens every intake door (the key swap is not done)."
            fi
            exit 0
          fi
          if [ -z "$SHOP_KEY" ] || [ -z "$BOUTIK_KEY" ]; then
            echo "::warning title=Échange de clés : clé producteur manquante::SERA_INTAKE_SECRET is gone from this repository but a producer key is missing here, so NOTHING is deleted: if the Worker still holds the shared key, it still opens every intake door (the swap is not done); if it does not, that producer's doors refuse everything. Set the missing producer key and run this workflow again."
            exit 0
          fi
          # Step 3: both producers have their own key and the repository no
          # longer holds the shared one, so the Worker must not either.
          # `secret list` prints NAMES only, never a value.
          # Captured first: under pipefail a grep that stops reading early could
          # make the list look failed, and the shared key would be left in place.
          LISTED=$(pnpm exec wrangler secret list)
          if grep -q '"name": *"SERA_INTAKE_SECRET"' <<<"$LISTED"; then
            printf 'y\n' | pnpm exec wrangler secret delete SERA_INTAKE_SECRET
            echo "SERA_INTAKE_SECRET: deleted from the Worker's store — each producer now opens only its own intake doors"
          else
            echo "SERA_INTAKE_SECRET: already absent — each producer opens only its own intake doors"
          fi

      - name: Arm SERA_RIDER_VERIFY_SECRET (piped — skipped only if the repo secret is absent)
        working-directory: services/logistics-service
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RIDER_VERIFY_SECRET: ${{ secrets.SERA_RIDER_VERIFY_SECRET }}
        run: |
          if [ -z "$RIDER_VERIFY_SECRET" ]; then
            echo "::warning title=Porte rider-verify NON armée::SERA_RIDER_VERIFY_SECRET absent — the /verify/ door refuses rider-code verification (fail-closed) until the repo secret is set and this workflow re-dispatched."
            exit 0
          fi
          printf '%s' "$RIDER_VERIFY_SECRET" | pnpm exec wrangler secret put SERA_RIDER_VERIFY_SECRET

      # VRAI-ROUTE (2026-08-10) — logistics PRESENTS this key at custody's
      # /produce/* door (chain-open at dispatch + arming the machine pickup
      # code). SAME repo secret custody-deploy arms on its side — one value,
      # two Workers, or the produce wire refuses 401 and every course parks
      # `unsendable`. Fail-closed if absent.
      - name: Arm SERA_PRODUCE_SECRET (piped — skipped only if the repo secret is absent)
        working-directory: services/logistics-service
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PRODUCE_SECRET: ${{ secrets.SERA_PRODUCE_SECRET }}
        run: |
          if [ -z "$PRODUCE_SECRET" ]; then
            echo "::warning title=Cle produce NON armée::SERA_PRODUCE_SECRET absent — dispatch cannot open the custody chain or arm the machine pickup code (the produce outbox rests unsendable) until the repo secret is set and this workflow re-dispatched."
            exit 0
          fi
          printf '%s' "$PRODUCE_SECRET" | pnpm exec wrangler secret put SERA_PRODUCE_SECRET

      # COURSE-LIVRÉE (2026-08-13) — the key that GATES this Worker's
      # /produce/course-livree door (custody's drop-confirmation wire, which
      # closes a course as `delivered` and frees the rider). SAME repo secret
      # custody-deploy arms on its side — one value, two Workers, or every
      # confirmation is a 401 and the rider stays « carrying » for ever.
      # Fail-closed if absent: the door refuses everything with the one 401.
      - name: Arm SERA_COURSE_LIVREE_SECRET (piped — skipped only if the repo secret is absent)
        working-directory: services/logistics-service
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          LIVREE_SECRET: ${{ secrets.SERA_COURSE_LIVREE_SECRET }}
        run: |
          if [ -z "$LIVREE_SECRET" ]; then
            echo "::warning title=Porte course-livrée NON armée::SERA_COURSE_LIVREE_SECRET absent — la porte /produce/course-livree refuse tout (fail-closed) et une remise confirmée ne libère jamais le coursier, tant que le secret n'est pas posé et ce workflow relancé. Même valeur sur les deux Workers."
            exit 0
          fi
          printf '%s' "$LIVREE_SECRET" | pnpm exec wrangler secret put SERA_COURSE_LIVREE_SECRET

      # KEY CHANGE WINDOW (batch 8) — every key this Worker CHECKS also opens
      # to its `_NEXT` value while one is set, so a sender can move to a new
      # value before the old one stops working. A repo secret X_NEXT is put on
      # the Worker here; once it is gone from the repo, this run deletes it
      # from the Worker too, so a finished change never leaves an old value
      # open. Runs AFTER every key above, so a promotion (X = the new value,
      # X_NEXT deleted) never has a moment where only the old value opens.
      # Names only are printed — never a value or a length.
      - name: Arm or clear the next keys (X_NEXT — the window of a key change)
        working-directory: services/logistics-service
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SERA_OPS_SECRET_NEXT: ${{ secrets.SERA_OPS_SECRET_NEXT }}
          SERA_RIDER_VERIFY_SECRET_NEXT: ${{ secrets.SERA_RIDER_VERIFY_SECRET_NEXT }}
          SERA_COURSE_LIVREE_SECRET_NEXT: ${{ secrets.SERA_COURSE_LIVREE_SECRET_NEXT }}
          SERA_INTAKE_SHOP_SECRET_NEXT: ${{ secrets.SERA_INTAKE_SHOP_SECRET_NEXT }}
          SERA_INTAKE_BOUTIK_SECRET_NEXT: ${{ secrets.SERA_INTAKE_BOUTIK_SECRET_NEXT }}
        run: |
          set -euo pipefail
          LISTED=$(pnpm exec wrangler secret list)
          for NAME in SERA_OPS_SECRET_NEXT SERA_RIDER_VERIFY_SECRET_NEXT SERA_COURSE_LIVREE_SECRET_NEXT SERA_INTAKE_SHOP_SECRET_NEXT SERA_INTAKE_BOUTIK_SECRET_NEXT; do
            VALUE="${!NAME:-}"
            if [ -n "$VALUE" ]; then
              printf '%s' "$VALUE" | pnpm exec wrangler secret put "$NAME"
              case "$NAME" in
                SERA_RIDER_VERIFY_SECRET_NEXT|SERA_COURSE_LIVREE_SECRET_NEXT)
                  echo "::warning title=Changement de clé en cours::$NAME is set — the old and the new value of ${NAME%_NEXT} both open its doors. Séra custody sends this key from the same repository secret, so finish in this order: (1) put the new value in ${NAME%_NEXT}; (2) run custody-deploy — NOT this workflow — so Séra custody sends the new value; (3) only then delete $NAME from this repository's secrets and run this workflow again. Running this workflow between (1) and (2) would refuse Séra custody's old value." ;;
                *)
                  echo "::warning title=Changement de clé en cours::$NAME is set — the old and the new value of ${NAME%_NEXT} both open its doors. To finish: once every sender presents the new value, put it in ${NAME%_NEXT}, delete $NAME from this repository's secrets, and run this workflow again." ;;
              esac
            elif grep -q "\"name\": *\"$NAME\"" <<<"$LISTED"; then
              printf 'y\n' | pnpm exec wrangler secret delete "$NAME"
              echo "$NAME: deleted from the Worker — only ${NAME%_NEXT} opens its doors now"
            fi
          done

      # ═══ The F9 assertion: the live Worker must BE the bundle this job built ═══
      # A Workers deploy PROPAGATES; it does not switch — poll up to 180s.
      - name: Assert the live logistics Worker is the bundle this job built
        env:
          LOGISTICS_BASE: ${{ vars.LOGISTICS_BASE }}
        run: |
          set -uo pipefail
          if [ -z "${LOGISTICS_BASE}" ]; then
            echo "::error::LOGISTICS_BASE repo variable is empty — the deploy above ran, but NOTHING verified it."
            echo "Set the variable to the Worker's URL and re-dispatch so this step can prove the live Worker is this build."
            exit 1
          fi
          BASE="${LOGISTICS_BASE%/}"
          OUT=$(mktemp)
          DEADLINE=$(( $(date +%s) + 180 ))
          LIVE_CANON='?'; LIVE_RELEASE='?'
          while :; do
            CODE=$(curl -sS -o "$OUT" -w '%{http_code}' "$BASE/health" || echo 000)
            if [ "$CODE" = "200" ]; then
              LIVE_CANON=$(node -p "JSON.parse(require('fs').readFileSync('$OUT','utf8')).canon" 2>/dev/null || echo '?')
              LIVE_RELEASE=$(node -p "JSON.parse(require('fs').readFileSync('$OUT','utf8')).release" 2>/dev/null || echo '?')
              echo "health 200 — live canon=$LIVE_CANON release=$LIVE_RELEASE (want $SERA_CANON / $SERA_RELEASE)"
              if [ "$LIVE_CANON" = "$SERA_CANON" ] && [ "$LIVE_RELEASE" = "$SERA_RELEASE" ]; then
                echo "PROVENANCE OK — live logistics Worker is $SERA_RELEASE speaking canon $SERA_CANON."
                # The intake key swap's progress — a presence flag only, never a
                # key, a length or which key is missing.
                SPLIT=$(node -p "String(JSON.parse(require('fs').readFileSync('$OUT','utf8')).intakeSplit)" 2>/dev/null || echo '?')
                if [ "$SPLIT" = "true" ]; then
                  echo "Échange de clés des portes intake : TERMINÉ — chaque producteur n'ouvre que ses propres portes."
                elif [ "$SPLIT" = "false" ]; then
                  echo "::notice::Échange de clés des portes intake : pas encore terminé (la clé partagée existe encore, ou une clé producteur manque)."
                fi
                exit 0
              fi
            else
              echo "health $CODE — not answering yet"
            fi
            if [ "$(date +%s)" -ge "$DEADLINE" ]; then
              echo "::error::DEPLOY DID NOT TAKE — after 180s the live logistics Worker is still not this job's bundle."
              echo "  live canon=$LIVE_CANON release=$LIVE_RELEASE"
              echo "  want canon=$SERA_CANON release=$SERA_RELEASE"
              exit 1
            fi
            sleep 10
          done
