name: live-watch

# DOES EACH LIVE SERVICE STILL RUN MAIN? — every morning, and on demand.
#
# Each deploy proves the live Worker is the bundle THAT job built; nothing
# proved it built main. This asks each live Worker which commit it was built
# from (the `release` its /health answers, stamped at bundle time) and goes red
# unless main has changed nothing that service is built from since: its
# folder, the packages it builds from, the lock file, the workspace
# manifests, the shared TypeScript base (tsconfig.base.json, which every
# service and package config extends) and the build plan (turbo.json, read
# by the deploy's `pnpm build`). An input missing from main is red too, so a
# renamed folder or a typo here cannot read « OK » forever. Red does not mean broken code: it means a deploy is owed (or the
# live service was built outside the pipeline, or its address is not set).
#
# The log is public: it prints only the service name, the canon, the two short
# commits and the verdict — never the /health answer. Each service is asked
# even when the one before it is red.

on:
  schedule:
    # 05:30 UTC daily — just after the morning board, before Ouaga's day.
    - cron: '30 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The comparison needs main's history, not only its newest commit.
          fetch-depth: 0
      - name: Does the live custody service still run main?
        if: ${{ !cancelled() }}
        env:
          BASE: ${{ vars.CUSTODY_BASE }}
        run: bash scripts/live-watch.sh custody "$BASE" services/custody-service packages/observability pnpm-lock.yaml pnpm-workspace.yaml package.json tsconfig.base.json turbo.json
      - name: Does the live logistics service still run main?
        if: ${{ !cancelled() }}
        env:
          BASE: ${{ vars.LOGISTICS_BASE }}
        run: bash scripts/live-watch.sh logistics "$BASE" services/logistics-service packages/observability pnpm-lock.yaml pnpm-workspace.yaml package.json tsconfig.base.json turbo.json
