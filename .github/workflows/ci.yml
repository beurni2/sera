name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Every morning at 05:00 UTC the board runs again on main's newest commit,
  # so a check that turns red without a push (an expired date, a moved
  # dependency) is seen. A red newest run also stops service releases.
  schedule:
    - cron: '0 5 * * *'

# This job READS the tree and nothing else; the default token could write.
permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      # Every action pinned to a commit SHA, the tag it resolves from kept
      # beside it (the same pins Shop+ and Boutik+ run): a moving tag is code
      # nobody here reviewed.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0 (what the moving v4 resolves to)
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      # The platform-contracts grant is SCOPED: a gitconfig under the runner's
      # temp dir that only this step reads (GIT_CONFIG_GLOBAL), the token as
      # env rather than in the script text, nothing written when the secret is
      # unset (platform-contracts is public; the lockfile resolves it to a
      # codeload tarball), and the file deleted when the install ends. Three URL
      # forms, one tokened rewrite (pnpm records git deps in ssh/scp form on
      # some resolve paths); --add, because url.<base>.insteadOf is single-valued.
      - name: Install (frozen lockfile) with a scoped platform-contracts grant, discarded after
        env:
          GIT_CONFIG_GLOBAL: ${{ runner.temp }}/platform-contracts.gitconfig
          PLATFORM_CONTRACTS_READ_TOKEN: ${{ secrets.PLATFORM_CONTRACTS_READ_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${PLATFORM_CONTRACTS_READ_TOKEN}" ]; then
            B="https://x-access-token:${PLATFORM_CONTRACTS_READ_TOKEN}@github.com/beurni2/platform-contracts"
            git config --global url."$B".insteadOf "https://github.com/beurni2/platform-contracts"
            git config --global --add url."$B".insteadOf "git@github.com:beurni2/platform-contracts"
            git config --global --add url."$B".insteadOf "ssh://git@github.com/beurni2/platform-contracts"
          fi
          trap 'rm -f "$GIT_CONFIG_GLOBAL"' EXIT
          pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Install Playwright chromium (dispatch-console harness)
        run: pnpm --filter @sera/dispatch-console exec playwright install --with-deps chromium
      - name: Run every invariant gate (positives + negative fixtures)
        run: bash scripts/run-gates.sh
