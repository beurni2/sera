name: expo-preview

# WO-4.0 — the founder's window: publish-on-merge to the Expo "preview"
# channel. The job SKIPS GRACEFULLY (with a visible annotation) while the
# EXPO_TOKEN secret is absent; the founder adds it in repo settings to arm
# the channel. The token is referenced ONLY as a secret via env — it appears
# in no committed file, no echoed log line, no lockfile (scan-gated).

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  publish-preview:
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      # ═══ SE-LIVE-4c-iv — THE TWO WORKER ADDRESSES, AND NOTHING ELSE ═══
      #
      # These are repo VARIABLES, not secrets, and that is correct: they are
      # public URLs (the same ones `/health` answers on). `EXPO_PUBLIC_*` is
      # INLINED INTO THE SHIPPED BUNDLE, so anything named here is published —
      # which is why the founder's `SERA_CUSTODY_OPS_SECRET`, the
      # service-to-service `SERA_RIDER_VERIFY_SECRET`, and every other key are
      # absent and must stay absent. A test asserts that.
      #
      # THE RIDER'S OWN CODE IS NEVER HERE EITHER. It is a credential, typed by
      # the rider on the sign-in screen, held in memory for the session only.
      #
      # UNSET ⇒ the app builds and runs, signs nobody in, and says plainly that
      # this build cannot reach Séra. It never fakes a session or a custody
      # seal. Set both variables in Settings → Variables to arm the preview
      # against the live Workers.
      EXPO_PUBLIC_SERA_LOGISTICS_BASE: ${{ vars.LOGISTICS_BASE }}
      EXPO_PUBLIC_SERA_CUSTODY_BASE: ${{ vars.CUSTODY_BASE }}
      # ═══ THE MEDIA BUCKET — ONE URL AND THE ONE KEY THAT MAY BE BUNDLED ═══
      #
      # The proof photo is uploaded here, and the ref the bucket returns is what
      # the custody ledger records. Without BOTH of these the app cannot produce
      # a ledger-grade ref, so the seal refuses rather than inventing one —
      # correct, but it means the rider cannot take custody at all. Set them.
      #
      # ⚠ MEDIA_WRITE_KEY IS A SECRET IN GITHUB AND PUBLIC IN THE BUNDLE, AND
      # THAT IS THE RULED DESIGN, NOT AN OVERSIGHT. MEDIA-KEY-SPLIT separated
      # the WRITE key — which the media-service's own comments say « ships in
      # app bundles » — from the founder-only MEDIA_REVOKE_SECRET. A write key
      # can ADD bytes; it cannot read, list, revoke or delete. It is stored as a
      # secret only so it is not printed in logs and can be rotated in one
      # place. No other key belongs in this block, ever.
      EXPO_PUBLIC_SERA_MEDIA_BASE: ${{ vars.MEDIA_BASE }}
      EXPO_PUBLIC_SERA_MEDIA_WRITE_KEY: ${{ secrets.MEDIA_WRITE_KEY }}
    steps:
      - name: Check EXPO_TOKEN presence (skip gracefully when absent)
        id: token
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::notice title=Aperçu Expo non publié::Le secret EXPO_TOKEN n'est pas configuré — l'ajouter dans Settings → Secrets pour armer la publication automatique (voir PREVIEW.md)."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.token.outputs.present == 'true'
      - uses: pnpm/action-setup@v4
        if: steps.token.outputs.present == 'true'
      - uses: actions/setup-node@v4
        if: steps.token.outputs.present == 'true'
        with:
          node-version: 22
          cache: pnpm
      - name: Authorize read access to platform-contracts (CI-only)
        if: steps.token.outputs.present == 'true'
        run: |
          git config --global url."https://x-access-token:${{ secrets.PLATFORM_CONTRACTS_READ_TOKEN }}@github.com/beurni2/platform-contracts".insteadOf "https://github.com/beurni2/platform-contracts"
          git config --global --add url."https://x-access-token:${{ secrets.PLATFORM_CONTRACTS_READ_TOKEN }}@github.com/beurni2/platform-contracts".insteadOf "ssh://git@github.com/beurni2/platform-contracts"
          git config --global --add url."https://x-access-token:${{ secrets.PLATFORM_CONTRACTS_READ_TOKEN }}@github.com/beurni2/platform-contracts".insteadOf "git@github.com:beurni2/platform-contracts"
      - run: pnpm install --frozen-lockfile
        if: steps.token.outputs.present == 'true'
      - name: Say which Séra this build can reach — and REFUSE to publish a demo build
        if: steps.token.outputs.present == 'true'
        run: |
          # ⚠ THIS FAILS. IT USED TO WARN, AND THE WARNING WAS A TRAP.
          #
          # Founder ruling 2026-08-10 (« for the preview trap make it fail »),
          # on the verifier's finding: `isWired()` reads these very variables,
          # so a preview published without them is not « the app, unconfigured »
          # — it is the DEMO WORLD, a different application with different
          # screens. It still walks the seal screen this repo has now abolished
          # twice, and a rider (or the founder, testing) cannot tell the two
          # apart from the phone.
          #
          # A publish that silently swaps the product for a mock is worse than
          # no publish. So: no Séra, no preview.
          if [ -z "$EXPO_PUBLIC_SERA_LOGISTICS_BASE" ] || [ -z "$EXPO_PUBLIC_SERA_CUSTODY_BASE" ]; then
            echo "::error title=Aperçu refusé — pas relié à Séra::LOGISTICS_BASE et/ou CUSTODY_BASE ne sont pas configurés (Settings → Variables). Sans eux, l'aperçu publié serait l'application de DÉMONSTRATION, pas la vraie : d'autres écrans, aucune course réelle, et rien sur le téléphone ne le dit. Publication annulée."
            exit 1
          fi
          echo "logistics: $EXPO_PUBLIC_SERA_LOGISTICS_BASE"
          echo "custody:   $EXPO_PUBLIC_SERA_CUSTODY_BASE"
          # The photo is not optional equipment: no bucket ⇒ no ref ⇒ the seal
          # cannot be registered, so custody never begins on this build. Warn
          # in the same voice, and never print the key itself.
          if [ -z "$EXPO_PUBLIC_SERA_MEDIA_BASE" ] || [ -z "$EXPO_PUBLIC_SERA_MEDIA_WRITE_KEY" ]; then
            echo "::warning title=Aperçu sans photo de preuve::MEDIA_BASE (Variables) et/ou MEDIA_WRITE_KEY (Secrets) ne sont pas configurés. La photo de remise ne peut pas être enregistrée, donc la livraison ne peut pas être prouvée à la porte — l'écran le dit clairement. Le scellé, lui, ne demande plus de photo (ROUTE-DIRECTE)."
          else
            echo "media:     $EXPO_PUBLIC_SERA_MEDIA_BASE"
          fi
      - name: Publish rider-app preview update (EAS, non-interactive)
        if: steps.token.outputs.present == 'true'
        working-directory: apps/rider-app
        # The documented non-interactive chain: init links/creates the
        # project under the token's account on first run; update:configure
        # writes the runtime/update config into the CI workspace only
        # (ephemeral — never committed); update publishes to the preview
        # channel. First REAL publish is founder-verified on his phone.
        run: |
          npx eas-cli@20.5.1 init --non-interactive --force
          npx eas-cli@20.5.1 update:configure --non-interactive
          npx eas-cli@20.5.1 update --channel preview --non-interactive --auto --message "main@${GITHUB_SHA}"
