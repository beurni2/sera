name: expo-preview

# WO-4.0 — the founder's window: publish-on-merge to the Expo "preview"
# channel. The job SKIPS GRACEFULLY (with a visible annotation) while the
# EXPO_TOKEN secret is absent; the founder adds it in repo settings to arm
# the channel. The token is referenced ONLY as a secret via env — it appears
# in no committed file, no echoed log line, no lockfile (scan-gated).

on:
  # A publish follows ci: it starts when a ci run on main FINISHES, never on
  # the push itself (ci was still running then). The decision step below
  # ships only main's newest commit, only when ci is green on it.
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# `actions: read` lets the decision step read ci's results with the job's own
# token.
permissions:
  contents: read
  actions: read

jobs:
  publish-preview:
    # Queue, never cancel: a publish in flight always finishes. GitHub keeps
    # only one waiting job here, which is why the decision always ships main's
    # newest. The group is on the job, not the workflow: a run whose if: below
    # skips never joins it, so it cannot push out the waiting good publish.
    concurrency:
      group: expo-preview
      cancel-in-progress: false
    # Only a SUCCESSFUL ci run started by a push to main, or a dispatch on
    # main. The decision step checks the same again from GitHub itself.
    if: (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    # EXPO_TOKEN is not set for the whole job, where every step (and every
    # action) could read it: only the presence check and the publish step hold
    # it, as in Shop+ and Boutik+.
    env:
      # ═══ SE-LIVE-4c-iv — THE TWO WORKER ADDRESSES, AND NOTHING ELSE ═══
      #
      # These are repo VARIABLES, not secrets, and that is correct: they are
      # public URLs (the same ones `/health` answers on). `EXPO_PUBLIC_*` is
      # INLINED INTO THE SHIPPED BUNDLE, so anything named here is published —
      # which is why the founder's `SERA_CUSTODY_OPS_SECRET`, the
      # service-to-service `SERA_RIDER_VERIFY_SECRET`, and every other key are
      # absent and must stay absent. A test asserts that.
      #
      # THE RIDER'S OWN CODE IS NEVER HERE EITHER. It is a credential, typed by
      # the rider on the sign-in screen, held in memory for the session only.
      #
      # UNSET ⇒ the app builds and runs, signs nobody in, and says plainly that
      # this build cannot reach Séra. It never fakes a session or a custody
      # seal. Set both variables in Settings → Variables to arm the preview
      # against the live Workers.
      EXPO_PUBLIC_SERA_LOGISTICS_BASE: ${{ vars.LOGISTICS_BASE }}
      EXPO_PUBLIC_SERA_CUSTODY_BASE: ${{ vars.CUSTODY_BASE }}
      # ═══ THE MEDIA BUCKET — ONE URL AND THE ONE KEY THAT MAY BE BUNDLED ═══
      #
      # The proof photo is uploaded here, and the ref the bucket returns is what
      # the custody ledger records. Without BOTH of these the app cannot produce
      # a ledger-grade ref, so the seal refuses rather than inventing one —
      # correct, but it means the rider cannot take custody at all. Set them.
      #
      # ⚠ MEDIA_WRITE_KEY IS A SECRET IN GITHUB AND PUBLIC IN THE BUNDLE, AND
      # THAT IS THE RULED DESIGN, NOT AN OVERSIGHT. MEDIA-KEY-SPLIT separated
      # the WRITE key — which the media-service's own comments say « ships in
      # app bundles » — from the founder-only MEDIA_REVOKE_SECRET. A write key
      # can ADD bytes; it cannot read, list, revoke or delete. It is stored as a
      # secret only so it is not printed in logs and can be rotated in one
      # place. No other key belongs in this block, ever.
      EXPO_PUBLIC_SERA_MEDIA_BASE: ${{ vars.MEDIA_BASE }}
      EXPO_PUBLIC_SERA_MEDIA_WRITE_KEY: ${{ secrets.MEDIA_WRITE_KEY }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Decide what may ship (main's newest commit, green in ci)
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_EVENT: ${{ github.event.workflow_run.event }}
        run: bash scripts/publish-decision.sh
      - name: Check EXPO_TOKEN presence (skip gracefully when absent)
        if: steps.decide.outputs.publish == 'true'
        id: token
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::notice title=Aperçu Expo non publié::Le secret EXPO_TOKEN n'est pas configuré — l'ajouter dans Settings → Secrets pour armer la publication automatique (voir PREVIEW.md)."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      # Every action pinned to a commit SHA, the tag it resolves from kept
      # beside it (the same pins Shop+ and Boutik+ run).
      # The commit the decision chose, which may be newer than the one whose
      # ci run started this.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: steps.token.outputs.present == 'true'
        with:
          ref: ${{ steps.decide.outputs.sha }}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0 (what the moving v4 resolves to)
        if: steps.token.outputs.present == 'true'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: steps.token.outputs.present == 'true'
        with:
          node-version: 22
          cache: pnpm
      # The platform-contracts grant is SCOPED, as in ci.yml: a temp gitconfig
      # only this step reads, the token as env rather than in the script text,
      # nothing written when the secret is unset, deleted after the install.
      - name: Install (frozen lockfile) with a scoped platform-contracts grant, discarded after
        if: steps.token.outputs.present == 'true'
        env:
          GIT_CONFIG_GLOBAL: ${{ runner.temp }}/platform-contracts.gitconfig
          PLATFORM_CONTRACTS_READ_TOKEN: ${{ secrets.PLATFORM_CONTRACTS_READ_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${PLATFORM_CONTRACTS_READ_TOKEN}" ]; then
            B="https://x-access-token:${PLATFORM_CONTRACTS_READ_TOKEN}@github.com/beurni2/platform-contracts"
            git config --global url."$B".insteadOf "https://github.com/beurni2/platform-contracts"
            git config --global --add url."$B".insteadOf "git@github.com:beurni2/platform-contracts"
            git config --global --add url."$B".insteadOf "ssh://git@github.com/beurni2/platform-contracts"
          fi
          trap 'rm -f "$GIT_CONFIG_GLOBAL"' EXIT
          pnpm install --frozen-lockfile
      - name: Say which Séra this build can reach — and REFUSE to publish a demo build
        if: steps.token.outputs.present == 'true'
        run: |
          # ⚠ THIS FAILS. IT USED TO WARN, AND THE WARNING WAS A TRAP.
          #
          # Founder ruling 2026-08-10 (« for the preview trap make it fail »),
          # on the verifier's finding: `isWired()` reads these very variables,
          # so a preview published without them is not « the app, unconfigured »
          # — it is the DEMO WORLD, a different application with different
          # screens. It still walks the seal screen this repo has now abolished
          # twice, and a rider (or the founder, testing) cannot tell the two
          # apart from the phone.
          #
          # A publish that silently swaps the product for a mock is worse than
          # no publish. So: no Séra, no preview.
          if [ -z "$EXPO_PUBLIC_SERA_LOGISTICS_BASE" ] || [ -z "$EXPO_PUBLIC_SERA_CUSTODY_BASE" ]; then
            echo "::error title=Aperçu refusé — pas relié à Séra::LOGISTICS_BASE et/ou CUSTODY_BASE ne sont pas configurés (Settings → Variables). Sans eux, l'aperçu publié serait l'application de DÉMONSTRATION, pas la vraie : d'autres écrans, aucune course réelle, et rien sur le téléphone ne le dit. Publication annulée."
            exit 1
          fi
          echo "logistics: $EXPO_PUBLIC_SERA_LOGISTICS_BASE"
          echo "custody:   $EXPO_PUBLIC_SERA_CUSTODY_BASE"
          # The photo is not optional equipment: no bucket ⇒ no ref ⇒ the seal
          # cannot be registered, so custody never begins on this build. Warn
          # in the same voice, and never print the key itself.
          if [ -z "$EXPO_PUBLIC_SERA_MEDIA_BASE" ] || [ -z "$EXPO_PUBLIC_SERA_MEDIA_WRITE_KEY" ]; then
            echo "::warning title=Aperçu sans photo de preuve::MEDIA_BASE (Variables) et/ou MEDIA_WRITE_KEY (Secrets) ne sont pas configurés. Il ne reste qu'une photo dans l'application — celle du ramassage, quand le coursier signale une différence — et elle ne pourra pas être enregistrée. La remise n'en demande plus (PORTE-SANS-PHOTO) : elle se termine avec le code de la cliente."
          else
            echo "media:     $EXPO_PUBLIC_SERA_MEDIA_BASE"
          fi
      - name: Publish rider-app preview update (EAS, non-interactive)
        if: steps.token.outputs.present == 'true'
        working-directory: apps/rider-app
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          PUBLISHED_SHA: ${{ steps.decide.outputs.sha }}
          # PROFIL-PUBLIÉ (founder ruling 2026-09-30, Boutik+ AUDIT-B+2 F-55:
          # « No live pages should show any test mode banner ») — THE PUBLISHED
          # CHANNEL IS NOT AN APERÇU. It is the road to real riders; left unset,
          # the profile defaults to `preview` in src/preview.ts and the shell wore
          # « Aperçu — bac à sable » on every screen of every phone this step
          # publishes to. That banner is for a local Expo Go run only. A literal,
          # not a secret: a build posture must be readable in review. The EAS
          # channel keeps its NAME (`preview`): renaming it would orphan every
          # installed phone's update subscription. Same fix as Shop+'s reseller
          # app (PROFIL-PUBLIÉ, AUDIT-SHOP-2 F-43).
          EXPO_PUBLIC_PROFILE: 'production'
        # The documented non-interactive chain: init links/creates the
        # project under the token's account on first run; update:configure
        # writes the runtime/update config into the CI workspace only
        # (ephemeral — never committed); update publishes to the preview
        # channel. First REAL publish is founder-verified on his phone.
        run: |
          npx eas-cli@20.5.1 init --non-interactive --force
          npx eas-cli@20.5.1 update:configure --non-interactive
          npx eas-cli@20.5.1 update --channel preview --non-interactive --auto --message "main@${PUBLISHED_SHA}"
