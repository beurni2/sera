name: rollback

# ROLLBACK — put one live service back on a version Cloudflare already holds.
#
# It rebuilds nothing and uploads nothing: Cloudflare keeps the service's
# last 100 versions, and this only points the service back at one of them.
# Every run first lists the newest versions (date and version id only), so
# a run with an empty « version » is also the way to read that list.
#
#   · version empty, rollback unticked → list only, nothing changes;
#   · rollback ticked, version empty   → back to the version before the
#     current one;
#   · rollback ticked, version given   → back to that version.
#
# KEYS GO BACK WITH THE VERSION. A Worker's keys (its secrets) belong to
# each version: going back to an older version puts back the key values that
# version had. When a key changed since, Cloudflare first refuses (code
# 10220); outside a terminal wrangler answers its own question with « yes »
# and rolls back anyway, older key values included. This run does not try to
# stop that: after the rollback it names each key that went back (names only,
# as wrangler prints them) and says how to write today's value again.
#
# WHAT IT CANNOT DO, stated so nobody counts on it: it does not roll back
# data (stored orders, custody records, accounts), and Cloudflare refuses a
# rollback across a change of Durable Object classes or migrations, or to a
# version whose bindings were since deleted. Then the road is forward: revert
# on main and deploy again. The page docs/runbooks/ROLLBACK.md says all of it
# in plain words.
#
# Only from main, and only once the founder approves the run (`production`).
# The log prints dates, version ids, the live release and canon — never
# account e-mails (wrangler's own lines are filtered) or a live answer.

on:
  workflow_dispatch:
    inputs:
      service:
        description: "Which live service"
        required: true
        type: choice
        options:
          - custody-service
          - logistics-service
      rollback:
        description: "Tick to roll back. Unticked, the run only lists the versions."
        required: false
        type: boolean
        default: false
      version:
        description: "Version id to go back to (from the list). Empty = the version before the current one."
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: rollback
  cancel-in-progress: false

jobs:
  rollback:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Nothing changes live until the founder approves this run.
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0 (what the moving v4 resolves to)
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      # The deploy tool comes from the lock file (wrangler 4.130.0); the
      # platform-contracts grant is the scoped one ci.yml explains (a temp
      # gitconfig only this step reads, deleted after; nothing written when
      # the secret is unset).
      - name: Install (frozen lockfile) with a scoped platform-contracts grant, discarded after
        env:
          GIT_CONFIG_GLOBAL: ${{ runner.temp }}/platform-contracts.gitconfig
          PLATFORM_CONTRACTS_READ_TOKEN: ${{ secrets.PLATFORM_CONTRACTS_READ_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${PLATFORM_CONTRACTS_READ_TOKEN}" ]; then
            B="https://x-access-token:${PLATFORM_CONTRACTS_READ_TOKEN}@github.com/beurni2/platform-contracts"
            git config --global url."$B".insteadOf "https://github.com/beurni2/platform-contracts"
            git config --global --add url."$B".insteadOf "git@github.com:beurni2/platform-contracts"
            git config --global --add url."$B".insteadOf "ssh://git@github.com/beurni2/platform-contracts"
          fi
          trap 'rm -f "$GIT_CONFIG_GLOBAL"' EXIT
          pnpm install --frozen-lockfile
      - name: List the versions, then roll back if asked, then read /health
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SERVICE: ${{ inputs.service }}
          DO_ROLLBACK: ${{ inputs.rollback }}
          VERSION: ${{ inputs.version }}
          BASE_0: ${{ vars.CUSTODY_BASE }}
          BASE_1: ${{ vars.LOGISTICS_BASE }}
        run: |
          set -euo pipefail
          case "$SERVICE" in
            custody-service) DIR=services/custody-service; BASE="$BASE_0" ;;
            logistics-service) DIR=services/logistics-service; BASE="$BASE_1" ;;
            *) echo "::error::unknown service"; exit 1 ;;
          esac
          [[ "$VERSION" =~ ^[0-9a-f-]{0,64}$ ]] || { echo "::error::the version must be a version id from the list"; exit 1; }
          cd "$DIR"
          # Never an account e-mail in this public log.
          quiet() { sed -E 's/[[:alnum:]._%+-]+@[[:alnum:].-]+/<e-mail>/g'; }
          echo "---- the 10 newest deployments of $SERVICE (date · version (traffic)) ----"
          pnpm exec wrangler deployments list --json 2>/dev/null | node -e '
            const t = require("fs").readFileSync(0, "utf8");
            const list = JSON.parse(t.slice(t.indexOf("["), t.lastIndexOf("]") + 1));
            list.sort((a, b) => String(b.created_on).localeCompare(String(a.created_on)));
            for (const d of list.slice(0, 10))
              console.log(new Date(d.created_on).toISOString(), "·", (d.versions || []).map((v) => `${v.version_id} (${v.percentage}%)`).join(", "));
          ' || echo "(could not read the list)"
          health() {
            OUT="$(mktemp)"
            CODE="$(curl -sS -m 20 -o "$OUT" -w '%{http_code}' "${BASE%/}/health" 2>/dev/null)" || CODE=000
            node -e '
              let b = {}; try { b = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")); } catch {}
              const ok = (v) => (typeof v === "string" && /^[0-9A-Za-z.+-]{1,40}$/.test(v) ? v : "?");
              console.log(`${process.argv[2]}: HTTP ${process.argv[3]} · release=${ok(b.release)} · canon=${ok(b.canon)}`);
            ' "$OUT" "$1" "$CODE"
            rm -f "$OUT"
          }
          health "live before"
          if [ "$DO_ROLLBACK" != "true" ]; then
            echo "List only: nothing was changed. Tick « rollback » to go back one version, or give a version id."
            exit 0
          fi
          START=$(date +%s)
          rearm() {
            case "$SERVICE:$1" in
            custody-service:SHOP_PROGRESS_SECRET) echo "run custody-deploy on main with « write_shop_progress_secret » ticked" ;;
            custody-service:*) echo "run custody-deploy on main (it writes this key on every run)" ;;
            logistics-service:*) echo "run logistics-deploy on main (it writes this key on every run)" ;;
              *) echo "run this service's deploy on main, or put it again the way it was first set" ;;
            esac
          }
          RB="$(mktemp)"
          pnpm exec wrangler rollback ${VERSION:+"$VERSION"} --message "rollback from GitHub run $GITHUB_RUN_ID" --yes 2>&1 | quiet | tee "$RB"
          # The keys that went back with the version: wrangler lists their
          # names (never values) under « The following secrets have changed ».
          if grep -q 'secrets have changed' "$RB"; then
            KEYS="$(awk '/secrets have changed/ { f = 1; next } f && /^[[:space:]]*\*[[:space:]]/ { print $2; next } f { f = 0 }' "$RB" | tr -cd 'A-Za-z0-9_\n')"
            [ -n "$KEYS" ] || echo "::warning title=Keys went back with the version::the deploy tool said keys changed since that version but named none here. Run this service's deploy on main to write its keys again."
            for K in $KEYS; do
              echo "::warning title=Key $K went back with the version::$K now holds the value it had in that older version. To put today's value back: $(rearm "$K")."
            done
          fi
          rm -f "$RB"
          # Cloudflare reports the switch, not the rollout: read /health for up to a minute.
          for attempt in $(seq 1 12); do sleep 5; health "live after ($attempt)"; done
          echo "rollback done in $(( $(date +%s) - START )) s — compare the release above with the one before."
